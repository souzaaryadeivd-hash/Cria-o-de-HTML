<!DOCTYPE html>
<html>
    <head>
        <style>
            body
            {
                font-size: 2rem;
            }
            #container
            {
                width: 1070px; margin: 0 auto;
                /*display: flex;*/
                /*flex-direction: row;*//*Todos os elementos em uma unida linha*/
                /*flex-direction: column;*//*Todos os elementos em uma unica coluna*/
            }
            /*Uso da pseudoclasse :hover*/
            #link:hover
            {
                color: rgb(191, 194, 55);
            }
            /*Uso do psudoelemento ::first-line*/
            #container-texto
            {
                padding: 10px;
                color: rgb(15, 15, 165);
                border: 30px solid #bbb;
            }
            #container-texto::first-line
            {
                color: rgb(165, 15, 15);
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <h1>PseudoClasses</h1>
            <a href="#" id="link">Link</a>

            <h1>PseudoElementos</h1>
            <p id="container-texto">Este é um parágrafo de exemplo.</p>
        </div>
    </body>
</html>
